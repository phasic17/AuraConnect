name: build-macos-dmg
on:
  push:
    branches: [ feat/omicron-live ]
  workflow_dispatch:
jobs:
  dmg:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Use latest Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1 || echo /Applications/Xcode.app)
          echo "Selecting $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version
      - name: Build (unsigned, Release)
        run: |
          set -o pipefail
          xcodebuild -project AuraConnect.xcodeproj -scheme AuraConnect -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO \
            build
      - name: Package .dmg
        run: |
          APP=$(find build -name "AuraConnect.app" -type d | head -1)
          echo "APP=$APP"
          mkdir -p dmgroot
          cp -R "$APP" dmgroot/
          ln -s /Applications dmgroot/Applications
          hdiutil create -volname "AuraConnect" -srcfolder dmgroot -ov -format UDZO AuraConnect.dmg
          ls -la AuraConnect.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: AuraConnect-dmg
          path: AuraConnect.dmg
